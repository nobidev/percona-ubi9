name: build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      targets:
        description: Targets to build (space separated <image>/<version>, or all)
        type: string
        default: all
      publish:
        description: Push the verified images to GHCR
        type: boolean
        default: true
      force_push:
        description: Push rebuilt images even when their sources did not change (new UBI 9 packages)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# A publishing run is never cancelled half-way (two tags per target are
# pushed one after the other); superseded pull request runs are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: Lint scripts, check pins, apply patches
        run: make check
      - name: Select targets
        id: targets
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          all="$(make -s targets)"
          if [[ -n "${REQUESTED}" && "${REQUESTED}" != all ]]; then
            for t in ${REQUESTED}; do
              grep -qxF "${t}" <<< "${all}" || { echo "::error::unknown target ${t}"; exit 1; }
            done
            selected="${REQUESTED}"
          else
            selected="${all}"
          fi
          targets="$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' <<< "${selected}")"
          echo "targets=${targets}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check.outputs.targets) }}
    name: ${{ matrix.target }}
    env:
      TARGET: ${{ matrix.target }}
      # Pull requests build and verify only; pushes to main and manual runs
      # on main (unless publish is unticked) also publish, and only in this
      # repository (not in forks).
      PUBLISH: ${{ github.repository == 'nobidev/percona-ubi9' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
      # Rebuilt images are pushed only when their build key (sources) changed.
      FORCE_PUSH: ${{ inputs.force_push && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      # Optional: avoids Docker Hub's anonymous pull rate limit (golang
      # builder, control and copied images) when the credentials exist.
      - name: Log in to Docker Hub
        if: vars.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [[ -z "${DOCKER_TOKEN}" ]]; then
            echo "DOCKER_TOKEN is not available here; pulling from Docker Hub anonymously"
            exit 0
          fi
          echo "${DOCKER_TOKEN}" | docker login docker.io -u "${DOCKER_USERNAME}" --password-stdin

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user binutils
          qemu-x86_64 --version | head -n 1
          docker buildx version
          make info

      - name: Build
        run: make build

      - name: Verify (a-c)
        run: make verify-image

      - name: Verify control (d)
        run: make verify-control

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        run: make push

      - name: Check anonymous pull
        if: env.PUBLISH == 'true'
        run: scripts/check-public.sh "${TARGET}"

      - name: Summary
        if: always()
        run: |
          work="build/work/${TARGET}"
          {
            echo "### ${TARGET}"
            for f in verify.log control.log digests.txt; do
              if [[ -f "${work}/${f}" ]]; then
                echo "#### ${f}"
                echo '```'
                sed 's/\x1b\[[0-9;]*m//g' "${work}/${f}"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # OLM bundles (bundles/*) and the catalog of them. Pull requests push them to
  # a throwaway local registry only, to render, validate and verify them.
  olm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      registry:
        image: registry:2.8.3
        ports: ['5000:5000']
    env:
      PUBLISH: ${{ github.repository == 'nobidev/percona-ubi9' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        if: vars.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [[ -z "${DOCKER_TOKEN}" ]]; then
            echo "DOCKER_TOKEN is not available here; pulling from Docker Hub anonymously"
            exit 0
          fi
          echo "${DOCKER_TOKEN}" | docker login docker.io -u "${DOCKER_USERNAME}" --password-stdin

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user binutils
          make bundles

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # opm runs in a container: on a pull request it reaches the local
      # registry over the host network; when publishing it reads the GHCR
      # credentials (new GHCR packages are private) from a config that holds
      # only those.
      - name: Select the OLM registry
        run: |
          if [[ "${PUBLISH}" == true ]]; then
            mkdir -p "${RUNNER_TEMP}/opm-docker"
            jq '{auths: {"ghcr.io": .auths["ghcr.io"]}}' "${HOME}/.docker/config.json" > "${RUNNER_TEMP}/opm-docker/config.json"
            jq -e '.auths["ghcr.io"].auth' "${RUNNER_TEMP}/opm-docker/config.json" > /dev/null
            echo "OPM_RUN_ARGS=-v ${RUNNER_TEMP}/opm-docker/config.json:/tmp/.docker/config.json:ro" >> "$GITHUB_ENV"
          else
            {
              echo "OLM_REGISTRY=localhost:5000/percona-ubi9"
              echo "OPM_RUN_ARGS=--network host"
              echo "REQUIRE_PUBLISHED_IMAGES=0"
            } >> "$GITHUB_ENV"
          fi

      - name: Build bundles
        run: make olm-bundles

      - name: Push bundles
        run: make olm-push-bundles

      - name: Build catalog
        run: make olm-catalog

      - name: Verify catalog
        run: make olm-verify

      - name: Verify control (d)
        run: make verify-control TARGET=percona-postgresql-operator/3.1.0

      - name: Push catalog
        if: env.PUBLISH == 'true'
        run: make olm-push-catalog

      - name: Check anonymous pull
        if: env.PUBLISH == 'true'
        run: scripts/check-public.sh --images $(cut -d' ' -f2 build/olm/bundles.txt) $(cut -d' ' -f1 build/olm/catalog.txt)

      - name: Summary
        if: always()
        run: |
          {
            echo "### OLM"
            for f in bundles.txt catalog.txt verify.log; do
              if [[ -f "build/olm/${f}" ]]; then
                echo "#### ${f}"
                echo '```'
                sed 's/\x1b\[[0-9;]*m//g' "build/olm/${f}"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
